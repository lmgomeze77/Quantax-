[build]
  publish = "public"
  functions = "netlify/functions"

# slide_08.png lives outside the publish directory so it is never served as a
# static asset; it is bundled with the function that gates it instead.
[functions]
  included_files = ["protected/**"]

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
